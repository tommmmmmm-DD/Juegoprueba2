<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click &amp; Read</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
:root{--bg:#07040f;--panel:rgba(14,8,26,.80);--card:#241a3f;--line:#8c733b;--ink:#030208;--text:#f1eaff;--muted:#b9acd9;--acc:#a97bff;--accink:#14082c;--gold:#f0c35a;--pink:#e0508a;--tile:#3a2c60;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "Pixelify Sans","Press Start 2P",ui-monospace,Menlo,Consolas,monospace}
canvas{image-rendering:pixelated;display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:linear-gradient(#04020c,#120a30 45%,#2a1758 75%,#4a2a76)}
.hot{position:fixed;z-index:0;background:transparent;border:0;padding:0;cursor:default}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:150px 14px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;pointer-events:none}
main>*,.col>*{pointer-events:auto}
.col{display:contents}
.p-book{order:1}.p-foe{order:2}.p-up{order:3}.p-shop{order:4}.p-reborn{order:5}.p-egg{order:6}
@media(min-width:900px){main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.15fr) minmax(300px,1.1fr);align-items:start;gap:16px}
.col{display:flex;flex-direction:column;gap:14px;pointer-events:none}.col>*{order:0}}
.panel{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:14px}
h2{margin:0 0 10px;font-size:19px;font-weight:700;color:#cbb0ff;letter-spacing:.5px}
p{margin:6px 0;font-size:14px;line-height:1.45}
.sub{font-size:14px;color:var(--muted)}
.mine{display:flex;flex-direction:column;align-items:center;text-align:center}
#title{font:400 14px "Press Start 2P",monospace;color:#cbb0ff;cursor:pointer;user-select:none;margin-bottom:10px}
#count{font-size:clamp(34px,6vw,48px);font-weight:700;color:var(--gold);line-height:1.1;word-break:break-all;text-shadow:3px 3px 0 var(--ink)}
.rock{background:none;border:0;padding:0;margin:14px 0 8px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .05s}
.rock canvas{width:min(78vw,340px);height:auto;aspect-ratio:34/22;filter:drop-shadow(0 0 16px rgba(169,123,255,.6))}
.rock:active{transform:translateY(5px) scale(.97)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.float{position:fixed;pointer-events:none;color:var(--gold);z-index:40;font-size:22px;font-weight:700;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink);animation:up .9s ease-out forwards;transform:translate(-50%,-50%)}
.float.crit{color:#fff;font-size:30px;text-shadow:3px 3px 0 var(--pink),-1px -1px 0 var(--ink)}
@keyframes up{to{transform:translate(-50%,-110px);opacity:0}}
@media(prefers-reduced-motion:reduce){.float{animation:none}.rock{transition:none}.gold,.fbook{animation:none!important}}
.list{display:grid;gap:8px}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:7px;font:inherit;color:var(--text);background:var(--card);border:3px solid var(--ink);cursor:pointer}
.up[disabled]{opacity:.5;cursor:not-allowed}
.up:not([disabled]):hover{border-color:var(--acc)}
.ico{background:var(--tile);border:2px solid var(--line);padding:3px}
.ico canvas{width:52px;height:52px}
.nm{display:block;font-size:15px;font-weight:600;line-height:1.25}
.ds{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.cost{font-size:15px;font-weight:700;color:var(--gold);text-align:right}
.bar{height:18px;border:3px solid var(--ink);background:#0d0817;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.bar.thin{height:12px;margin:6px 0}
#hp{background:var(--pink)}#tm{background:var(--gold)}
.btn{font:700 15px "Pixelify Sans",monospace;padding:9px 14px;color:var(--accink);background:var(--acc);border:3px solid var(--ink);cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--text)}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.foe{display:flex;gap:12px;align-items:center}
#fsprite{width:132px;height:132px;display:flex;align-items:center;justify-content:center;background:var(--tile);border:3px solid var(--line);flex:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#fsprite:disabled{cursor:default;opacity:.6}
#fsprite.boss:disabled{opacity:1;border-color:var(--pink)}
#fsprite:active:not(:disabled){transform:scale(.92)}
#fsprite canvas{width:112px;height:auto}
.foe .col2{flex:1;min-width:0}
#fname{font-weight:700;font-size:16px;margin:0}
#critbox{display:flex;flex-direction:column;align-items:center;margin-top:10px}
#critbtn{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#crit{width:176px;height:176px}
#now{height:20px;font:400 12px "Press Start 2P",monospace;color:var(--gold)}
.card{background:var(--card);border:3px solid var(--ink);padding:10px;margin-bottom:8px}
.card.got{border-color:var(--acc)}
.verse{font-size:15px;line-height:1.4;margin:0}
.by{font-size:13px;color:var(--muted);margin:4px 0 0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);max-width:92vw;width:max-content;background:var(--panel);border:3px solid var(--gold);padding:9px 14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fbook{position:absolute;right:14px;top:6px;background:none;border:0;padding:0;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
.fbook canvas{width:44px;height:auto;filter:drop-shadow(0 0 6px rgba(240,195,90,.7))}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.tbook{position:absolute;right:6px;bottom:4px;background:none;border:0;padding:0;opacity:.22;cursor:default}
.tbook canvas{width:20px;height:auto}
.gold{position:fixed;z-index:30;background:none;border:0;padding:0;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
.gold canvas{width:68px;height:auto;filter:drop-shadow(0 0 12px #f0c35a)}
#start,#poem{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,3,12,.55)}
#poem{z-index:70;background:rgba(5,3,12,.8)}
.box{max-width:460px;width:100%;background:#140b26;border:4px solid var(--gold);box-shadow:6px 6px 0 var(--ink);padding:22px;text-align:center}
.box h1{font:400 22px/1.4 "Press Start 2P",monospace;color:var(--gold);margin:0 0 10px;text-shadow:3px 3px 0 var(--ink)}
.box .btn{display:block;width:100%;margin-top:10px;font-size:17px}
.ptitle{color:#cbb0ff;font-weight:700;font-size:15px}
#ptext{font-size:21px;line-height:1.4;margin:14px 0}
#pauth{color:var(--gold);font-size:16px}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<button class="hot" id="hmoon" aria-label="Luna" tabindex="-1"></button>
<button class="hot" id="hcrow" aria-label="Cuervo" tabindex="-1"></button>
<main>
  <div class="col">
    <section class="panel p-foe">
      <h2 id="ftitle">Enemigos</h2>
      <div class="foe"><button id="fsprite" aria-label="Atacar enemigo" disabled></button>
        <div class="col2"><p id="fname"></p><div class="bar thin"><i id="hp"></i></div><div class="bar thin"><i id="tm"></i></div><p id="finfo" class="sub"></p></div></div>
      <div id="critbox" hidden><button id="critbtn" aria-label="Golpear"><canvas id="crit" width="64" height="64"></canvas></button><div id="now"></div><p class="sub" style="text-align:center">Pulsa justo cuando el círculo brille. Antes o después, el golpe es débil.</p></div>
    </section>
    <section class="panel p-reborn">
      <h2>Renacer</h2><div class="bar"><i id="bar"></i></div><p id="pinfo"></p>
      <div class="foot"><button class="btn" id="prestige">Renacer</button><button class="btn ghost" id="save">Guardar</button><button class="btn ghost" id="wipe">Borrar todo</button><button class="btn ghost" id="fx">Fondo animado: sí</button></div>
    </section>
    <section class="panel p-egg">
      <h2>Easter egg</h2><p id="collN" class="sub"></p><div id="coll"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel p-book mine">
      <div id="title">Click &amp; Read</div>
      <div class="sub">Páginas</div>
      <div id="count">0</div>
      <div class="sub" id="rate"></div>
      <button class="rock" id="rock" aria-label="Leer libro"></button>
      <div class="sub" id="per"></div>
      <div class="sub" id="ed"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel p-up"><h2>Autores y libros</h2><div class="list" id="list"></div><button class="tbook" id="tbook" aria-label="Libro diminuto" tabindex="-1"></button></section>
    <section class="panel p-shop"><button class="fbook" id="fbook" aria-label="Libro flotante"></button>
      <h2>Escriba automático</h2><p id="ainfo"></p><div class="foot"><button class="btn" id="abtn"></button></div>
      <h2 style="margin-top:16px">Tienda de objetos</h2><p id="ink" class="sub"></p><div class="list" id="shop"></div>
    </section>
  </div>
</main>
<div id="start"><div class="box"><h1>Click &amp; Read</h1><p class="sub">Lee, derrota monstruos de los libros y renace.</p>
  <button class="btn" id="bcont">Continuar</button><button class="btn ghost" id="bnew">Nueva partida</button></div></div>
<div id="poem" hidden role="dialog" aria-modal="true"><div class="box"><p class="ptitle">Poema desbloqueado:</p><p id="ptext"></p><p id="pauth"></p><button class="btn" id="pclose">Cerrar</button></div></div>
<div id="toast" role="status"></div>

    var dt=Math.min((now-last)/1000,1);last=now;
    if(playing){
      gain(perSec()*dt);foeTick(dt);
      if(foe&&foe.boss)drawCrit(critState(now));
      acc+=dt;if(acc>=0.1){acc=0;render()}
      eggT+=dt;if(eggT>=1){eggT=0;checkEggs()}
    }
    requestAnimationFrame(tick);
  }
  var hasSave=false,newArm=false;
  try{hasSave=!!localStorage.getItem(KEY)}catch(e){}
  $("bcont").hidden=!hasSave;
  function begin(){$("start").hidden=true;playing=true;last=performance.now();render();renderColl();schedGold(true)}
  $("bcont").addEventListener("click",function(){load();begin()});
  $("bnew").addEventListener("click",function(){
    if(hasSave&&!newArm){newArm=true;this.textContent="¿Seguro? Se borrará tu progreso";return}
    try{localStorage.removeItem(KEY)}catch(e){}
    fresh();begin();
  });
  renderColl();render();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
